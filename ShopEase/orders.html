<!DOCTYPE html>
<html>
<head>
<title>My Orders</title>

<style>
body{font-family:Arial;background:#f2f2f2;}

.container{
    max-width:900px;
    margin:auto;
    padding:20px;
}

.card{
    background:white;
    padding:15px;
    margin-bottom:15px;
    border-radius:10px;
}

.top{
    display:flex;
    justify-content:space-between;
}

.status{
    padding:5px 10px;
    border-radius:20px;
    color:white;
    font-size:12px;
}

.pending{background:orange;}
.delivered{background:green;}

.item{
    display:flex;
    justify-content:space-between;
    margin:5px 0;
}

.btn{
    margin-top:10px;
    padding:8px 12px;
    background:#02246e;
    color:white;
    border:none;
    border-radius:5px;
    cursor:pointer;
}
.home{
    margin-top:10px;
    padding:8px 12px;
    background:#04c15c;
    color:white;
    border:none;
    border-radius:5px;
    cursor:pointer;
    margin-bottom: 10%;
    margin-left: 40%;
    width:10%;
    font-size: 16px;
    font-weight: bold;
    text-align: center;
}
</style>
</head>

<body>

<div class="container">
    <h2>My Orders 📦</h2>
    <div id="orders"></div>
</div>
<div class="home">
    <a onclick="home()">Go to Home</a>
</div>
<script>

const userId = localStorage.getItem("user_id");

if(!userId){
    alert("Please login first");
    window.location.href = "login.html";
}

// LOAD ORDERS
fetch(`http://localhost:3000/orders/${userId}`)
.then(res => res.json())
.then(data => {

    console.log("Orders:", data);

    const container = document.getElementById("orders");

    if(!data || data.length === 0){
        container.innerHTML = "<h3>No Orders Found 😕</h3>";
        return;
    }

    let html = "";

    data.forEach(order => {

        let statusClass = order.status === "delivered" ? "delivered" : "pending";
        let statusText = order.status || "pending";

        html += `
        <div class="card">

            <div class="top">
                <div>
                    <h3>Order #${order.id}</h3>
                    <p>${order.created_at ? new Date(order.created_at).toLocaleString() : ""}</p>
                </div>

                <div class="status ${statusClass}">
                    ${statusText}
                </div>
            </div>

            <p><b>Name:</b> ${order.name}</p>
            <p><b>Phone:</b> ${order.phone}</p>
            <p><b>Address:</b> ${order.address}</p>

            <h4>Total: ₹${order.total}</h4>

            <button class="btn" onclick="viewItems(${order.id})">
                View Items
            </button>

            <div id="items-${order.id}" style="display:none;"></div>

        </div>
        `;
    });

    container.innerHTML = html;
});


// VIEW ITEMS
function viewItems(orderId){

    const box = document.getElementById(`items-${orderId}`);

    if(box.innerHTML !== ""){
        box.style.display = box.style.display === "none" ? "block" : "none";
        return;
    }

    fetch(`http://localhost:3000/order-items/${orderId}`)
    .then(res => res.json())
    .then(items => {

        let html = "";

        items.forEach(i => {
            html += `
            <div class="item">
                <span>${i.product_name} x ${i.quantity}</span>
                <span>₹${i.price * i.quantity}</span>
            </div>
            `;
        });

        box.innerHTML = html;
        box.style.display = "block";
    });
}
function home(){
    window.location.href="index.html";
}
</script>
</body>
</html>
