<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ShopEase | Forgot Password</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial;
}

body{
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    background:#e7e7e7;
}

.login-container{
    background:#d8d6d6;
    padding:30px;
    border-radius:12px;
    width:350px;
    border:3px solid gray;
}

.login-container h2{
    text-align:center;
    color:#002c8a;
    margin-bottom:15px;
}

.input-group{
    margin-bottom:15px;
}

.input-group input{
    width:100%;
    padding:10px;
    border-radius:8px;
    border:1px solid black;
}

.login-btn{
    width:100%;
    padding:10px;
    border:none;
    border-radius:8px;
    background:orange;
    cursor:pointer;
    margin-top:8px;
}

#msg{
    text-align:center;
    margin-top:10px;
    font-weight:bold;
}
a{
     width:100%;
    padding:10px;
    border:none;
    border-radius:8px;
    background:orange;
    cursor:pointer;
    margin-top:50px;
    text-decoration: none;
    color: black;
    margin-left: 100px;
}
</style>
</head>

<body>

<div class="login-container">
<h2>Forgot Password</h2>

<!-- STEP 1 -->
<div id="step1" class="input-group">
  <input type="email" id="email" placeholder="Enter Email">
  <button type="button" onclick="sendOTP()" class="login-btn">Send OTP</button>
</div>

<!-- STEP 2 -->
<div id="step2" class="input-group" style="display:none;">
  <input type="text" id="otp" placeholder="Enter OTP">
  <button type="button" onclick="verifyOTP()" class="login-btn">Verify OTP</button>
</div>

<!-- STEP 3 -->
<div id="step3" class="input-group" style="display:none;">
  <input type="password" id="newPassword" placeholder="New Password">
  <button type="button" onclick="resetPassword()" class="login-btn">Reset Password</button>
</div>
<a href="register.html"> Back to login</a>
<p id="msg"></p>
</div>
<script>
const API = "http://localhost:3000";
let userEmail = "";

// ================= SEND OTP =================
function sendOTP() {
    const email = document.getElementById("email").value;

    if (!email) {
        alert("Please enter email");
        return;
    }

    fetch(API + "/send-otp", {
        method: "POST",
        headers: {"Content-Type": "application/json"},
        body: JSON.stringify({ email })
    })
    .then(res => res.json())
    .then(data => {
        document.getElementById("msg").innerText = data.message;

        if (data.message === "OTP sent") {
            userEmail = email;

            document.getElementById("step1").style.display = "none";
            document.getElementById("step2").style.display = "block";

            alert("OTP: " + data.otp); // testing only
        }
    })
    .catch(err => {
        console.log(err);
        document.getElementById("msg").innerText = "Error sending OTP";
    });
}

// ================= VERIFY OTP =================
function verifyOTP() {
    const otp = document.getElementById("otp").value;

    if (!otp) {
        alert("Enter OTP");
        return;
    }

    fetch(API + "/verify-otp", {
        method: "POST",
        headers: {"Content-Type": "application/json"},
        body: JSON.stringify({
            email: userEmail,
            otp: otp
        })
    })
    .then(res => res.json())
    .then(data => {
        document.getElementById("msg").innerText = data.message;

        if (data.message === "OTP verified") {
            document.getElementById("step2").style.display = "none";
            document.getElementById("step3").style.display = "block";
        }
    })
    .catch(err => {
        console.log(err);
        document.getElementById("msg").innerText = "Error verifying OTP";
    });
}

// ================= RESET PASSWORD =================
function resetPassword() {
    const newPassword = document.getElementById("newPassword").value;

    if (!newPassword) {
        alert("Enter new password");
        return;
    }

    fetch(API + "/reset-password", {
        method: "POST",
        headers: {"Content-Type": "application/json"},
        body: JSON.stringify({
            email: userEmail,
            newPassword: newPassword
        })
    })
    .then(res => res.json())
    .then(data => {
        document.getElementById("msg").innerText = data.message;

        if (data.message === "Password reset successful") {
            alert("Password changed successfully!");
           
        }
    })
    .catch(err => {
        console.log(err);
        document.getElementById("msg").innerText = "Password already resetted";
    });
}
function back() {
   window.location.href("register.html");
}
</script>

</body>
</html>
