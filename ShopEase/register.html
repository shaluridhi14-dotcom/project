<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shop.com/Signin</title>
    <style>
        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
            font-family:Arial, Helvetica, sans-serif;
        }
        body{
            height:100vh;
            justify-content: center;
            align-items: center;
            background-color: #e7e7e7;
        }
        .login-container{
            background-color: #d8d6d6;
            padding:30px;
            border-radius: 12px;
            width:400px;
            border:3px solid rgb(126, 122, 122);
             align-items: center;
             margin-left:430px;
        }
        .login-container h2{
            text-align: center;
            color: #002c8a;
            align-items: center;
        }
        .nav-logo{
           align-items: center;
           margin-left:20px;
        }
        .input-group{
            margin-bottom: 15px;
        }
        .input-group label{
            font-size: 16px;
            color:#000000;
            font-weight: bold;
        }
        .input-group input{
            width:100%;
            padding:10px;
            margin-top:5px;
            border-radius: 8px;
            border:1px solid black;
            outline:none;
            transition:0.3s;
        }
        .input-group input:focus{
            border-width: 3px;
        }
        .login-btn{
            width:100%;
            padding:10px;
            border:none;
            border-radius:8px;
            background:orange;
            color:black;
            font-size:16px;
            cursor:pointer;
            transition: 0.3s;
        }
        .login-btn:hover{
            background-color: rgb(250, 189, 35);
        }
        .extra-links{
            text-align:center;
            margin-top:15px;
            font-size:14px;
        }
        .extra-links a{
            text-decoration: none;
            color:#02246e;
        }
        .extra-links a:hover{
            text-decoration:underline;
        }
    </style>
</head>
<body>
    <div class="nav-logo">
            <img src="shopeasy.png"height="100px"width="200px">
        </div>
    <div class="login-container">
        <h2>ShopEase Sign in</h2>
    <form id="loginForm">
        <div class="input-group">
            <label>Email</label>
            <input type="email"placeholder="Enter your email" id="email"required>
        </div>
        <div class="input-group">
            <label>Password</label>
            <input type="password"placeholder="Enter your password"id="password" required>
        </div>
        <button class="login-btn"type="submit"id="signin_btn">Sign in</button>
        <div class="extra-links"><p><a href="forgot-password.html">Forgot password?</a></p>
        <p>Don't have an account?<a href="account.html">Create Account</a></p>
        <div>
      <p class="extra-links"><a href="index.html"class="home"> Back to Home</a></p>
       </div>
        </div>
    </form>
    </div>
    <script>
document.getElementById("loginForm").addEventListener("submit", async (e) => {

  e.preventDefault();

  const email = document.getElementById("email").value;
  const password = document.getElementById("password").value;

  const res = await fetch("http://localhost:3000/login", {
    method: "POST",
    headers: {
      "Content-Type": "application/json"
    },
    body: JSON.stringify({ email, password })
  });

  const data = await res.json();

  console.log(data);

  if (data.success) {

    localStorage.setItem("user_id", data.user.id);

    localStorage.setItem("user", JSON.stringify(data.user));

    localStorage.setItem("name", data.user.name);
    localStorage.setItem("email", data.user.email);
    localStorage.setItem("mobile", data.user.mobile);
    localStorage.setItem("address", data.user.address);

    alert("Login Successful!");

    window.location.href = "profile.html";

  } else {

    alert(data.message);
  }
});
</script>
</body>
</html>
