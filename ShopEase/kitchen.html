<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ShopEase.com/kitchenWare</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css" integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw==" crossorigin="anonymous" referrerpolicy="no-referrer" />
    <style>
         body{
            background-color: black;
        }
        .heading{
            margin-left: 480px;
            color: white;
        }
        .product-container{
             display:grid;
        grid-template-columns: repeat(auto-fit,minmax(220px,1fr));
        gap:20px;
        }
       .product-card{
        position:relative;
        background:#ffffff;
        padding:15px;
        border-radius:10px;
       transition:transform 0.3s;
       }
       .product-card:hover{
        transform:scale(1.05);
       }
       .product-card img{
        width: 100%;
        border-radius: 10px;
       }
       .product-card h3{
        margin:10px;
       }
       .price{
        color:#2e7d32;
        font-weight: bold;
       }
       button{
        background-color: #02246e;
        color:white;
        font-weight: bold;
        border:none;
        padding:10px;
        width:100%;
        border-radius:5px;
        cursor:pointer;
        margin-top:10px;
       }
       button:hover{
        background-color: #2632bc;
       }
       .wishlist{
        position:absolute;
        top:10px;
        right:15px;
        font-size:22px;
        cursor:pointer;
        color:#999;
        transition:0.3s;
       }
       .wishlist:active{
        color:red;

       }
       .wishlist:hover{
        transform:scale(1.2);
       }
    </style>
</head>
<body>
   <section class="shop">
    <h1 class="heading">Our Kitchen Products</h1>
    <div class="product-container">
        <div class="product-card">
            <span class="wishlist"data-id="11"><i class="fas fa-heart"></i></span>
            <img src="induction.webp">
            <h3>Electric induction stove</h3>
            <p class="price">Rs.4999</p>
            <button data-id="11"class="add-cart">Add to Cart</button>
        </div>
        <div class="product-card">
            <span class="wishlist"data-id="12"><i class="fas fa-heart"></i></span>
            <img src="pans.jpg">
            <h3>All types of pans</h3>
            <p class="price">Rs.1999</p>
            <button data-id="12"class="add-cart">Add to Cart</button>
        </div>
        <div class="product-card">
            <span class="wishlist"data-id="13"><i class="fas fa-heart"></i></span>
            <img src="knives.webp">
            <h3>All Types of Knives</h3>
            <p class="price">Rs.1246</p>
            <button data-id="13"class="add-cart">Add to Cart</button>
        </div>
        <div class="product-card">
            <span class="wishlist"data-id="14"><i class="fas fa-heart"></i></span>
            <img src="cutlery.webp">
            <h3>Best Cutlery</h3>
            <p class="price">Rs.1549</p>
            <button data-id="14"class="add-cart">Add to Cart</button>
        </div>
        <div class="product-card">
            <span class="wishlist"data-id="15"><i class="fas fa-heart"></i></span>
            <img src="plates.webp">
            <h3>Big and small plates</h3>
            <p class="price">Rs.2399</p>
            <button data-id="15"class="add-cart">Add to Cart</button>
        </div>
        <div class="product-card">
            <span class="wishlist"data-id="16"><i class="fas fa-heart"></i></span>
            <img src="grinder.jpg">
            <h3>Mixer and grinder</h3>
            <p class="price">Rs.5499</p>
            <button data-id="16"class="add-cart">Add to Cart</button>
        </div>
        <div class="product-card">
            <span class="wishlist"data-id="17"><i class="fas fa-heart"></i></span>
            <img src="choppingboard.webp">
            <h3>Chopping board</h3>
            <p class="price">Rs.799</p>
            <button data-id="17"class="add-cart">Add to Cart</button>
        </div>
        <div class="product-card">
            <span class="wishlist"data-id="18"><i class="fas fa-heart"></i></span>
            <img src="cups.webp">
            <h3>Beautiful cup sets</h3>
            <p class="price">Rs.999</p>
            <button data-id="18"class="add-cart">Add to Cart</button>
        </div>
        <div class="product-card">
            <span class="wishlist"data-id="19"><i class="fas fa-heart"></i></span>
            <img src="cookware.avif">
            <h3>Cookwares</h3>
            <p class="price">Rs.1999</p>
            <button data-id="19"class="add-cart">Add to Cart</button>
        </div>
        <div class="product-card">
            <span class="wishlist"data-id="20"><i class="fas fa-heart"></i></span>
            <img src="masalabox.webp">
            <h3>Beautiful Spice box</h3>
            <p class="price">Rs.499</p>
            <button data-id="20"class="add-cart">Add to Cart</button>
        </div>
    </div>
   </section>
<script>
const userId = localStorage.getItem("user_id");

function initWishlist() {
    if (!userId) return;

    const hearts = document.querySelectorAll(".wishlist");

    hearts.forEach(heart => {
        const productId = heart.getAttribute("data-id");

        fetch(`http://localhost:3000/wishlist/check/${userId}/${productId}`)
        .then(res => res.json())
        .then(data => {
            if (data.exists) {
                heart.style.color = "red";
            } else {
                heart.style.color = "#999";
            }
        });
    });
}

document.querySelectorAll(".wishlist").forEach(heart => {
    heart.addEventListener("click", () => {

        if (!userId) {
            alert("Login first");
            return;
        }

        const productId = heart.getAttribute("data-id");

        if (heart.style.color === "red") {

            fetch("http://localhost:3000/wishlist/remove", {
                method: "DELETE",
                headers: {
                    "Content-Type": "application/json"
                },
                body: JSON.stringify({
                    user_id: userId,
                    product_id: productId
                })
            })
            .then(res => res.json())
            .then(() => {
                heart.style.color = "#999";
            });

        } else {

            fetch("http://localhost:3000/wishlist/add", {
                method: "POST",
                headers: {
                    "Content-Type": "application/json"
                },
                body: JSON.stringify({
                    user_id: userId,
                    product_id: productId
                })
            })
            .then(res => res.json())
            .then(() => {
                heart.style.color = "red";
            });
        }
    });
});

initWishlist();

document.querySelectorAll(".add-cart").forEach(btn => {
    btn.addEventListener("click", () => {

        if (!userId) {
            alert("Login first");
            return;
        }

        const productId = btn.getAttribute("data-id");

        fetch("http://localhost:3000/cart/add", {
            method: "POST",
            headers: {"Content-Type":"application/json"},
            body: JSON.stringify({
                user_id: userId,
                product_id: productId
            })
        })
        .then(res => res.json())
        .then(() => alert("Added to Cart 🛒"));
    });
});

</script>
    </body>
</html>
